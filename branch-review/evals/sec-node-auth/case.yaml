schema_version: "1.0"
name: sec-node-auth
description: >
  Authentication and authorization in a new billing router: UI-only authorization,
  IDOR, a client-supplied role, session fixation, an unverified JWT, a weak reset
  token, a non-constant-time signature check, and a check-then-act race on a balance. Reviewed with --security-only. Graders are named after the
  security-checklist bullet each defect exercises.
tags: [security, checklist]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review main --security-only
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 50
  timeout_seconds: 1200

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: llm
    name: c14-ui-only-authz
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: DELETE /api/projects/:id only requires login; the admin-only rule exists solely in the UI (src/ui/projects.tsx), not on the server.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c15-idor
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: GET /api/invoices/:id loads an invoice by id without the ownership check that src/routes/documents.ts applies (IDOR).
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c17-client-supplied-role
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: POST /api/refunds authorizes on the x-user-role request header, which the client controls.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c18-session-fixation
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: POST /login sets userId/role on the existing session without regenerating it (session fixation / no rotation on privilege change).
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c19-jwt-unverified
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: GET /api/partner/statement uses jwt.decode, which does not verify the signature, and trusts claims.partnerId.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c24-weak-random-token
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: the password-reset token comes from Math.random, which is not cryptographically secure.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c35-non-constant-time-compare
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: the payments webhook compares the HMAC signature with !==, not a constant-time comparison.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c36-toctou-balance
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: POST /api/wallet/withdraw checks the balance, then pays out, then writes the new balance non-atomically, so concurrent requests can overdraw (TOCTOU / race).
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1
