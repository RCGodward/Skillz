schema_version: "1.0"
name: declared-rules
description: >
  CONTRIBUTING.md declares a logging rule the new file breaks. .prettierrc says single
  quotes, but every file uses double quotes, and so does the new one. src/api mostly
  uses async/await, but its oldest file uses .then(); the new file uses .then().
tags: [house-style]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review main
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 40
  timeout_seconds: 900

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: llm
    name: applies-the-declared-logging-rule
    focus: last_message
    criteria: |
      PASS if a numbered finding says src/api/refunds.ts calls console.error instead
      of log from src/log.ts and cites CONTRIBUTING.md as the rule.
      FAIL if the finding is missing or does not cite CONTRIBUTING.md.
    weight: 3

  - type: llm
    name: code-beats-the-formatter-config
    focus: last_message
    criteria: |
      .prettierrc says singleQuote, but every existing file uses double quotes, as
      does the new one.
      PASS if no numbered finding asks the branch to switch to single quotes.
      Noting that the config and the code disagree is fine and expected.
      FAIL if a numbered finding proposes changing the new file's quotes.
    weight: 2

  - type: llm
    name: mentions-the-config-disagreement
    focus: last_message
    criteria: |
      PASS if the review mentions, anywhere, that .prettierrc's singleQuote setting
      disagrees with the double quotes the code actually uses.
      FAIL if the disagreement is not mentioned.
    weight: 1

  - type: llm
    name: local-neighborhood-wins
    focus: last_message
    criteria: |
      src/api is internally inconsistent: orders.ts and customers.ts use async/await
      with try/catch; the older reports.ts uses .then().
      PASS if a numbered finding says refunds.ts should follow the async/await pattern
      of orders.ts / customers.ts AND acknowledges that reports.ts uses .then() (names
      the split rather than presenting async/await as the only style in the directory).
      FAIL if the async-style finding is missing or doesn't acknowledge reports.ts.
    weight: 2

  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1
