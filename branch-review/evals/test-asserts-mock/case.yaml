schema_version: "1.0"
name: test-asserts-mock
description: >
  The branch's new Oregon test mocks salesTax - the function under test - to return 0
  and then asserts it returns 0, so it would pass whatever salesTax does.
tags: [correctness, tests]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review main
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 40
  timeout_seconds: 900

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: llm
    name: flags-the-test-asserting-its-mock
    focus: last_message
    criteria: |
      PASS if a numbered finding says the "charges no tax in Oregon" test mocks salesTax
      itself (jest.spyOn(...).mockReturnValue(0)) and then asserts the mocked value, so
      it never exercises the real code. FAIL if that is not among the numbered findings.
    weight: 3

  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1
