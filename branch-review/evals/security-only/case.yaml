schema_version: "1.0"
name: security-only
description: >
  The security-trace fixture plus style and comment material, reviewed with
  --security-only. The injection must be reported; the restating comment and the
  snake_case route must not be.
tags: [security, flags]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review main --security-only
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 40
  timeout_seconds: 900

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: llm
    name: reports-the-injection
    focus: last_message
    criteria: |
      PASS if a numbered finding reports SQL injection through req.query.q in
      src/routes/users.ts. FAIL otherwise.
    weight: 3

  - type: llm
    name: reports-no-style-or-comment-findings
    focus: last_message
    criteria: |
      The review was run with --security-only.
      PASS if no numbered finding is about style, naming (the /users_count route),
      or comments (the "// get the user count" comment). Correctness findings that
      are not security issues should also be absent.
      FAIL if any numbered finding is a style, naming, or comment finding.
    weight: 3

  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1

