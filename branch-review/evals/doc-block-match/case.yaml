schema_version: "1.0"
name: doc-block-match
description: >
  The opposite regime to doc-block-discipline: every exported function here has a
  JSDoc block with @param and @returns. The branch adds a parameter without
  documenting it, adds an exported function with no doc block, and raises the retry
  count to 5 under a comment that still says three tries.
tags: [comments, house-style]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review main
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 40
  timeout_seconds: 900

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: llm
    name: flags-the-stale-doc-block
    focus: last_message
    criteria: |
      PASS if a numbered finding says getJson's JSDoc does not document the new
      timeoutMs parameter (and/or still describes the old signature) and proposes
      adding an @param for it. FAIL if that is not among the numbered findings.
    weight: 2

  - type: llm
    name: proposes-a-matching-doc-block
    focus: last_message
    criteria: |
      PASS if a numbered finding says the new exported getText lacks the JSDoc block
      every other exported function in this repo has, and proposes adding one in the
      repo's shape -- either by showing it, or by naming what it holds (a summary line,
      @param, @returns). <output> allows describing a fix rather than writing it out.
      FAIL if getText's missing doc block is not a numbered finding, or if the proposed
      block uses tags the repo never uses (@example, @throws, @async, {type} braces).
    weight: 2

  - type: llm
    name: flags-the-stale-inline-comment
    focus: last_message
    criteria: |
      PASS if a numbered finding says the comment in getJson still says "three tries"
      although the default is now 5 attempts -- a stale comment.
      FAIL if that is not among the numbered findings.
    weight: 2

  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1
