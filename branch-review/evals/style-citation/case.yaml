schema_version: "1.0"
name: style-citation
description: >
  The branch adds a repository whose error handling and naming diverge from the two
  that already exist. Every style finding the review makes must cite a concrete
  file:line in this repo, which is the rule the skill exists to enforce.
tags: [house-style]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review main
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 40
  timeout_seconds: 900

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  # Mechanical proxy for the citation rule: a path:line reference must appear.
  - type: regex
    name: cites-a-file-and-line
    target: last_message
    pattern: '[A-Za-z0-9_./-]+\.[A-Za-z0-9]+:\d+'
    match: contains
    weight: 2

  - type: llm
    name: style-findings-are-evidenced
    focus: last_message
    criteria: |
      Judge only style or convention findings (naming, file layout, error-handling
      pattern, return conventions). Correctness and security findings are not judged
      here, whatever they cite.
      PASS if every style finding cites at least one location in this repo with a
      line number, as path:line or path:line-line (for example
      src/repositories/orderRepository.ts:4 or orderRepository.ts:7-9). A finding
      solely about a file's name may cite the sibling file path without a line.
      FAIL if any finding about class, method, or variable names, or about code shape,
      names a sibling file but gives no line number, or cites nothing from this repo.
      Also FAIL if the message contains no numbered findings at all.
    weight: 3

  - type: llm
    name: catches-the-missing-tenant-scope
    criteria: |
      The review notes that the new repository's query is missing the tenantId scope
      that both existing repositories apply, or otherwise flags it as a
      tenant-isolation problem.
    weight: 2

  # The approval prompt is the user's cue to answer; if anything follows it, or the
  # list landed in an earlier message, the review ended in the wrong place.
  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1

  # The Edit grader alone misses the other ways to write a file before approval.
  - type: tool_used
    name: gate-held-no-write-tool
    tool: Write
    min: 0
    max: 0
    weight: 3

  - type: tool_used
    name: gate-held-no-shell-edits
    tool: Bash
    input_match: 'sed -i|perl -pi|(>|tee) *\.?/?(src|test)/|git (commit|apply|checkout --)'
    min: 0
    max: 0
    weight: 3

  - type: regex
    name: findings-carry-a-severity
    target: last_message
    pattern: '\[(Blocker|Should fix|Optional)\]'
    match: contains
    weight: 1

  - type: regex
    name: closes-with-reviewed-section
    target: last_message
    pattern: '^\s*(?:[-*]\s+)?(?:#{1,4}\s+)?\*{0,2}Reviewed\b'
    flags: m
    match: contains
    weight: 1

  # The log contract. The sandbox gives each run its own HOME, so the file itself
  # isn't reachable from here; the heredoc that wrote it is in the trace.
  - type: regex
    name: log-written-with-a-timestamped-name
    target: trace
    pattern: 'branch-review-log/\d{4}-\d{2}-\d{2}-[A-Za-z0-9_.-]+-feat-invoices-\d{6}\.md'
    match: contains
    weight: 2

  - type: file_exists
    name: log-not-written-into-the-repo
    path: '**/*-feat-invoices-*.md'
    exists: false
    weight: 2

  # The template's fixed parts are mechanical, so they're regexes; in iteration 3 a
  # judge reading the (truncated) trace failed a log that matched the list exactly.
  - type: regex
    name: log-front-matter-is-complete
    target: trace
    pattern: 'branch: feat/invoices[\s\S]{0,400}skill_version: \S+[\s\S]{0,80}variant: skill[\s\S]{0,40}tool: claude-code[\s\S]{0,40}gate_held: yes[\s\S]{0,40}style_citations_ok:[ \t]*(\\n|\n)'
    match: contains
    weight: 1

  - type: regex
    name: log-dispositions-left-blank
    target: trace
    pattern: '\| 1 \| (blocker|should-fix|optional) \| (correctness|security|style|comments) \| *\|'
    match: contains
    weight: 1

  - type: regex
    name: log-keeps-the-missed-row
    target: trace
    pattern: '\| - \|  \|  \| missed \|  \|'
    match: contains
    weight: 1

  - type: regex
    name: tells-the-user-where-the-log-is
    target: last_message
    pattern: 'branch-review-log/'
    match: contains
    weight: 1
