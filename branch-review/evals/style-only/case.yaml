schema_version: "1.0"
name: style-only
description: >
  The style-citation fixture reviewed with --style-only. Its off-pattern naming and
  error handling must be reported; its missing tenant scope, a security issue, must not
  be among the numbered findings -- the user asked for one pass.
tags: [house-style, flags]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review main --style-only
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 40
  timeout_seconds: 900

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: llm
    name: reports-the-naming-divergence
    focus: last_message
    criteria: |
      PASS if a numbered finding says the new file/class/method names (invoice_repo.ts,
      InvoiceRepo, get_invoice) don't match the sibling repositories' conventions.
      FAIL otherwise.
    weight: 2


  - type: llm
    name: reports-no-security-findings
    focus: last_message
    criteria: |
      The review was run with --style-only.
      The new repository's missing tenantId parameter is ALSO a departure from the
      sibling repositories' pattern, so a style finding that says so and cites the
      siblings is correct here, even if it mentions in passing that there may be a
      security impact.
      PASS if no numbered finding is a security finding -- one whose main argument is an
      attack or exploit (injection, an IDOR exploit path, a traced untrusted input), or
      that is labelled with a security category.
      FAIL if any numbered finding is argued as a security vulnerability.
    weight: 3

  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1
