schema_version: "1.0"
name: sec-node-web
description: >
  Rendering and web surface in a new profile router: reflected XSS, a user-controlled
  href, header injection, a missing auth check, CSRF, mass assignment, a missing rate
  limit, and stack traces in errors. Reviewed with --security-only. Graders are named after the
  security-checklist bullet each defect exercises.
tags: [security, checklist]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review main --security-only
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 50
  timeout_seconds: 1200

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: llm
    name: c09-xss
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: GET /welcome in src/routes/profile.ts interpolates req.query.name into HTML unescaped (reflected XSS).
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c10-untrusted-href
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: the profile page puts user.website into an href without validating the scheme, so a javascript: URL runs script.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c11-header-injection
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: the export route builds the Content-Disposition header from req.query.filename, allowing header / CRLF injection or a spoofed filename.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c13-route-without-auth
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: DELETE /admin/users/:id has no requireAuth / requireAdmin, unlike the admin route in src/routes/account.ts.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c29-csrf
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: POST /profile (a cookie-session, state-changing route) lacks csrfProtection, which the sibling form routes in src/routes/account.ts use.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c30-mass-assignment
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: POST /profile passes req.body straight to db.users.update, letting a caller set fields like role (mass assignment).
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c31-rate-limit
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: POST /password-reset has no rate limit, unlike /login which uses loginLimiter.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c34-error-leakage
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: the error handler sends err.stack to the client.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1
