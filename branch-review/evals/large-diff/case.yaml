schema_version: "1.0"
name: large-diff
description: >
  About 2,500 changed lines, nearly all generated locale tables, plus a one-character
  change that inverts the session-expiry check. The review must say the diff is large,
  review the auth change first, and say what it skimmed or deferred.
tags: [scope]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review main
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 40
  timeout_seconds: 900

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: llm
    name: catches-the-inverted-expiry
    focus: last_message
    criteria: |
      PASS if a numbered finding labelled Blocker reports that isExpired in
      src/auth/session.ts now uses >= so live sessions count as expired and expired
      ones as live. FAIL if it is missing or labelled Should fix / Optional.
    weight: 3

  - type: llm
    name: says-what-it-deferred
    focus: last_message
    criteria: |
      PASS if the review says the diff is large (roughly 2,000+ lines) and states
      which files it skimmed, sampled, or deferred (the src/i18n locale tables).
      FAIL if it does not mention the size or does not say how it handled the
      locale files.
    weight: 2

  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1
