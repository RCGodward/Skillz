schema_version: "1.0"
name: scope-path
description: >
  The branch changes src/billing and src/ui. The review is restricted to src/billing,
  so it must report the divide-by-zero in refundFor and leave the src/ui change alone,
  even though that change has an obvious XSS.
tags: [scope]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review src/billing
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 40
  timeout_seconds: 900

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: llm
    name: finds-the-billing-bug
    focus: last_message
    criteria: |
      PASS if a numbered finding reports that refundFor in src/billing/proration.ts
      calls prorate with daysInPeriod 0, dividing by zero (Infinity/NaN refunds).
      FAIL if that is not among the numbered findings.
    weight: 3

  - type: llm
    name: stays-inside-the-path
    focus: last_message
    criteria: |
      The review was asked to cover only src/billing.
      PASS if no numbered finding is about src/ui/banner.ts. Mentioning that
      src/ui was out of scope, or noting it in passing outside the numbered list,
      is fine.
      FAIL if any numbered finding is about src/ui/banner.ts.
    weight: 3

  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1
