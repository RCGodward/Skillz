schema_version: "1.0"
name: sec-dotnet-java
description: >
  C# and Java integrations: polymorphic JSON deserialization, disabled TLS validation,
  an unchecked upload into the web root, XXE, and Runtime.exec with a string. Reviewed with --security-only. Graders are named after the
  checklist bullet (SKILL.md, security pass) each defect exercises.
tags: [security, checklist]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review main --security-only
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 50
  timeout_seconds: 1200

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: llm
    name: c39-dotnet-typenamehandling
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: PartnerController deserializes request JSON with TypeNameHandling.All, allowing attacker-chosen types.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c22-tls-validation-disabled
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: the partner HttpClient's ServerCertificateCustomValidationCallback always returns true, disabling TLS certificate validation.
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c32-unsafe-upload
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: the documents upload trusts file.FileName and writes into wwwroot/uploads with no type or size check (path traversal / served executable content).
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c07-xxe
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: FeedController parses request XML with a default DocumentBuilderFactory, leaving external entities / DTDs enabled (XXE).
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: llm
    name: c42-java-runtime-exec
    focus: last_message
    criteria: |
      PASS if a numbered finding reports this: FeedController passes the host request parameter into Runtime.getRuntime().exec as a single string (command injection).
      Severity label and wording don't matter, and it may share a finding with another
      issue. FAIL if it is not among the numbered findings.
    weight: 2

  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1
