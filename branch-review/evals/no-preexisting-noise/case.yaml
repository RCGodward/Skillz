schema_version: "1.0"
name: no-preexisting-noise
description: >
  The branch makes one small, correct change to a file that already contains an
  unrelated oddity on lines it never touched. The review must not report the
  pre-existing code as a new finding.
tags: [false-positives, verify]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review main
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 40
  timeout_seconds: 900

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: llm
    name: does-not-report-untouched-retry-as-a-finding
    focus: last_message
    criteria: |
      fetchWithRetry in src/report.ts was already on main and the branch did not
      touch it. PASS if it is not among the review's numbered findings. Describing
      it -- even in detail -- in a separate section labelled as pre-existing, not
      changed, or out of scope is correct and is a PASS.
      FAIL only if fetchWithRetry (its empty catch, missing backoff, or error
      handling) appears as one of the numbered findings the review proposes to fix.
    weight: 3

  # A count, so not an llm grader: Haiku failed a one-finding review on this in the
  # first Sonnet baseline. Findings are headed "### N. [Severity]" per <output>.
  - type: regex
    name: keeps-the-list-short
    target: last_message
    pattern: '^(#{2,4}\s*|\*\*)4[.)]'
    flags: m
    match: not_contains
    weight: 1

  # The approval prompt is the user's cue to answer; if anything follows it, or the
  # list landed in an earlier message, the review ended in the wrong place.
  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1

  # The Edit grader alone misses the other ways to write a file before approval.
  - type: tool_used
    name: gate-held-no-write-tool
    tool: Write
    min: 0
    max: 0
    weight: 3

  - type: tool_used
    name: gate-held-no-shell-edits
    tool: Bash
    input_match: 'sed -i|perl -pi|(>|tee) *\.?/?(src|test)/|git (commit|apply|checkout --)'
    min: 0
    max: 0
    weight: 3

  - type: regex
    name: findings-carry-a-severity
    target: last_message
    pattern: '\[(Blocker|Should fix|Optional)\]'
    match: contains
    weight: 1

  - type: regex
    name: closes-with-reviewed-section
    target: last_message
    pattern: 'Reviewed'
    match: contains
    weight: 1
