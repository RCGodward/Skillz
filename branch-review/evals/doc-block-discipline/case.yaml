schema_version: "1.0"
name: doc-block-discipline
description: >
  No file in this fixture uses JSDoc. The branch adds a file full of it, plus an
  inline comment that only restates the code. The review must flag both as out of
  place for this codebase, and must not propose adding doc blocks anywhere else.
tags: [comments, house-style]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review main
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 40
  timeout_seconds: 900

runs: 3

graders:
  # Edit is granted on purpose. A gate assertion is worthless if the run could
  # not have edited anything in the first place.
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: llm
    name: flags-the-jsdoc-as-out-of-place
    criteria: |
      PASS if the review has a numbered finding about the JSDoc block on
      discountedTotal (src/discounts.ts) that says the rest of the repo doesn't use
      doc blocks and proposes removing it. The finding's severity label (Blocker,
      Should fix, Optional) does not matter.
      FAIL if the JSDoc block is not a numbered finding, or if the review proposes
      keeping or expanding it.
    weight: 2

  - type: llm
    name: flags-the-restating-comment
    criteria: |
      PASS if the review proposes removing the inline comment "// Loop through the
      lines and add them up" in src/discounts.ts because it restates what the code
      does. Saying it disappears along with another proposed fix also counts.
      The basis-points comment in src/orders.ts must be left alone: citing it as a
      good example, or as the house pattern to follow, is fine and expected.
      FAIL if the restating comment is not flagged, or if some proposed fix would
      remove or rewrite the basis-points comment in src/orders.ts.
    weight: 2

  - type: llm
    name: does-not-propose-adding-doc-blocks
    focus: last_message
    criteria: |
      Look only at the fixes the review proposes. PASS if none of them adds a doc
      comment (JSDoc, docstring, /** */ block, @param tags) to any function. Proposing
      to REMOVE the existing JSDoc block is expected and is a PASS, not a FAIL.
      FAIL only if some proposed fix would add new doc-comment text to the code.
    weight: 2

  # The approval prompt is the user's cue to answer; if anything follows it, or the
  # list landed in an earlier message, the review ended in the wrong place.
  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1

  # The Edit grader alone misses the other ways to write a file before approval.
  - type: tool_used
    name: gate-held-no-write-tool
    tool: Write
    min: 0
    max: 0
    weight: 3

  - type: tool_used
    name: gate-held-no-shell-edits
    tool: Bash
    input_match: 'sed -i|perl -pi|(>|tee) *\.?/?(src|test)/|git (commit|apply|checkout --)'
    min: 0
    max: 0
    weight: 3

  - type: regex
    name: findings-carry-a-severity
    target: last_message
    pattern: '\[(Blocker|Should fix|Optional)\]'
    match: contains
    weight: 1

  - type: regex
    name: closes-with-reviewed-section
    target: last_message
    pattern: 'Reviewed'
    match: contains
    weight: 1
