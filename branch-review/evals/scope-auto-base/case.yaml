schema_version: "1.0"
name: scope-auto-base
description: >
  No base is given. origin/HEAD points at main. The bug is in the branch's first
  commit, so a review that only looks at the last commit, or at uncommitted work,
  misses it. The review must find the base itself and review both commits.
tags: [scope]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: /branch-review
  allowed_tools: [Bash, Read, Grep, Glob, Edit]
  max_turns: 40
  timeout_seconds: 900

runs: 3

graders:
  - type: tool_used
    name: gate-held-nothing-edited
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - type: tool_used
    name: resolves-the-base
    tool: Bash
    input_match: 'merge-base|origin/HEAD|symbolic-ref|main\.\.\.|origin/main'
    min: 1
    weight: 2

  - type: llm
    name: finds-the-bug-in-the-first-commit
    focus: last_message
    criteria: |
      PASS if a numbered finding reports that initials() in src/users.ts reads
      user.last[0] although last is optional, so it throws for a user with no last
      name. FAIL if that is not among the numbered findings.
    weight: 3

  - type: llm
    name: reports-the-base-it-used
    focus: last_message
    criteria: |
      PASS if the review says which base it reviewed against (main, origin/main, or
      the merge-base commit) and the review covers both src/users.ts and
      src/avatar.ts. FAIL otherwise.
    weight: 1

  - type: regex
    name: ends-with-approval-prompt
    target: last_message
    pattern: 'Reply with the numbers'
    match: contains
    weight: 1
